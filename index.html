<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داشبورد مدیریتی کاراشاب</title>
<meta name="description" content="گزارش مدیریتی واحدهای محصول، فضای ابری و ترافیک کاراشاب">
<meta name="robots" content="noindex">
<link rel="preload" href="assets/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem('kp.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
@font-face{font-family:"Vazirmatn";src:url("assets/fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
/* Layout: sticky tab bar → executive summary → product cards → portfolio charts; each product page is tinted with its own brand color. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --ink:#132030; --ink-2:#465567; --ink-3:#7a8797; --line:#dde3ea;
  --good:#1f7a4d; --warn:#a86a12; --crit:#c63a31; --focus:#2a78d6; --shadow:0 1px 2px rgba(19,32,48,.05),0 8px 24px rgba(19,32,48,.06);
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --surface-2:#1e2732; --ink:#edf1f5; --ink-2:#b2bdc9; --ink-3:#8492a1; --line:#2a3542;
  --good:#4cc38a; --warn:#e3a640; --crit:#f06b62; --focus:#5a9ff0; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --surface-2:#1e2732; --ink:#edf1f5; --ink-2:#b2bdc9; --ink-3:#8492a1; --line:#2a3542;
  --good:#4cc38a; --warn:#e3a640; --crit:#f06b62; --focus:#5a9ff0; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
.pc{--pc:var(--p,#2a78d6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pc{--pc:color-mix(in oklab,var(--p,#2a78d6) 84%,white)}}
:root[data-theme="dark"] .pc{--pc:color-mix(in oklab,var(--p,#2a78d6) 84%,white)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.8;margin:0;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:clamp(22px,2.6vw,30px);font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}

.top{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px 0;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.brand-mark{width:28px;height:28px;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;background:var(--ink)}
.brand-mark i{border-radius:2px}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.chip.stale{border-color:color-mix(in oklab,var(--warn) 50%,var(--line));color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.stale .dot{background:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pc,var(--ink))}
.tab .sw{width:9px;height:9px}
.unitsel{display:flex;gap:4px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px;font-size:12px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding-block:24px calc(64px + env(safe-area-inset-bottom,0px));padding-inline:20px;display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
section.sec-head{flex-direction:row}
.sec-head p{font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.grid-3{grid-template-columns:minmax(0,1fr)}main{padding-inline:16px}.top-in{padding-inline:16px}.panel{padding:16px}}

.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-text{display:flex;flex-direction:column;gap:10px}
.lede{font-size:16px;color:var(--ink-2);line-height:2}
.exec{border-inline-start:3px solid var(--ink);padding-inline-start:14px;font-size:14px;line-height:2.05;white-space:pre-line}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:26px;font-weight:800;line-height:1.3}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi small{font-size:11px;color:var(--ink-3)}
.kpi.alert b{color:var(--crit)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pcard{display:flex;flex-direction:column;gap:12px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.pcard:hover{border-color:color-mix(in oklab,var(--pc) 55%,var(--line));transform:translateY(-1px)}
.pcard-top{display:flex;gap:14px;align-items:center}
.pcard h3{font-size:17px;font-weight:800}
.pcard p{font-size:12.5px;color:var(--ink-2);line-height:1.9}
.ring{flex:none}
.mini-metrics{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.mini-metrics b{color:var(--ink);font-weight:700;margin-inline-end:3px}
.mini-metrics .warnb b{color:var(--crit)}
.nextdue{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:6px;min-width:0}
.nextdue span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.health{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px 1px 10px;white-space:nowrap;width:max-content}
.health svg{width:12px;height:12px}
.health.on-track{color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--surface))}
.health.at-risk{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.health.off-track{color:var(--crit);background:color-mix(in oklab,var(--crit) 12%,var(--surface))}

.sbar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.sbar.lg{height:22px;border-radius:5px}
.sbar i{display:block;height:100%;min-width:3px}
.seg-unknown{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface-2) 3px 6px)}
.seg-blocked{background:repeating-linear-gradient(135deg,var(--crit) 0 4px,color-mix(in oklab,var(--crit) 65%,var(--surface)) 4px 7px)}
.port-row{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:12px;align-items:center;padding:6px 0}
.port-row .pn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;border:0;background:none;padding:0;text-align:start}
.port-row .pn:hover{text-decoration:underline}
.port-row .pt{font-size:12px;color:var(--ink-2);text-align:end}
@media (max-width:520px){.port-row{grid-template-columns:90px minmax(0,1fr) 48px}}
.sw{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink-3);font-size:12px;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.heat td.h{text-align:center;font-weight:700;border:2px solid var(--surface);border-radius:6px;min-width:52px}

.dl{display:flex;flex-direction:column}
.dl-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.dl-row:last-child{border-bottom:0}
.dl-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:12px;font-weight:700;white-space:nowrap}
.when.late{color:var(--crit)} .when.soon{color:var(--warn)}

.phero{border-radius:18px;padding:26px;background:color-mix(in oklab,var(--pc) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--pc) 28%,var(--line));display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.phero{grid-template-columns:minmax(0,1fr);padding:20px}}
.phero .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.phero .badge i{width:14px;height:14px;border-radius:4px;background:var(--pc)}
.phero h1{font-size:clamp(26px,3.4vw,38px)}
.narr{font-size:14.5px;line-height:2.1;white-space:pre-line}
.auto-sum{font-size:13px;color:var(--ink-2);line-height:2}
.pkpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}
.pkpi{background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid color-mix(in oklab,var(--pc) 18%,var(--line))}
.pkpi b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.pkpi span{font-size:12px;color:var(--ink-2)}
.pkpi.alert b{color:var(--crit)}
@media (max-width:420px){.pkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stream{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 12px;align-items:center;padding:6px 0}
.stream .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream .vl{font-size:12px;color:var(--ink-2);text-align:end;grid-row:span 2}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.track i{height:100%;display:block}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:0}
.donut-legend span{display:flex;align-items:center;gap:8px}
.donut-legend i{width:12px;height:12px;border-radius:3px;flex:none}
.donut-legend b{margin-inline-start:auto;padding-inline-start:12px;font-weight:700}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;min-width:0;width:220px;max-width:100%}
.tasks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.task{border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task-h{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;width:100%;border:0;background:none;padding:11px 14px;text-align:start;align-items:start}
.task-h:hover{background:var(--surface-2)}
.task-h .bar{align-self:stretch;border-radius:2px}
.task-t{font-weight:600;font-size:13.5px;line-height:1.8;display:block}
.task-m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3);margin-top:2px}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 8px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:2px}
.prio-Critical{color:var(--crit);border-color:color-mix(in oklab,var(--crit) 40%,var(--line))}
.prio-High{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,var(--line))}
.task-d{padding:0 30px 14px 14px;font-size:13px;color:var(--ink-2);white-space:pre-line;line-height:2}
.more{border:0;background:var(--surface-2);padding:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:14px}

.rep{display:flex;flex-direction:column;gap:16px}
.rep-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rep-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-3);align-items:center}
.filechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:12px;color:var(--ink-2);background:var(--surface-2)}
.rep-sum{font-size:14px;line-height:2.05}
.rkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rkpi{border:1px solid color-mix(in oklab,var(--pc) 25%,var(--line));background:color-mix(in oklab,var(--pc) 6%,var(--surface));border-radius:12px;padding:10px 14px}
.rkpi b{display:block;font-size:20px;font-weight:800}
.rkpi span{font-size:12px;color:var(--ink-2)} .rkpi small{display:block;font-size:11px;color:var(--ink-3)}
.rcharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.rchart{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.rchart h4{margin:0;font-size:13px;font-weight:700}
.hbar{display:grid;grid-template-columns:minmax(70px,34%) minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12px}
.hbar .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bars{display:flex;flex-direction:column;gap:2px}
.hbar .b{display:flex;align-items:center;gap:6px}
.hbar .b i{height:12px;border-radius:4px 0 0 4px;display:block;min-width:2px}
.hbar .b span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.rlist{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.9}
.rcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.risk li::marker{color:var(--crit)}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap}
.rep-img{max-height:420px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:var(--surface-2);align-self:flex-start}
.rep-pdf{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.excerpt{white-space:pre-line;font-size:13.5px;line-height:2.05;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface-2)}
.pending{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.rep-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.rep-card:hover{border-color:color-mix(in oklab,var(--pc) 50%,var(--line))}
.rep-card .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in oklab,var(--pc) 14%,var(--surface));font-size:10px;font-weight:800}
.rep-item{display:flex;flex-direction:column;gap:6px;min-width:0}
.rep-item .rep-card{flex:1}
.rep-item>.btn{align-self:flex-end}
.rep-card p{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:3px 10px;font-size:12px}

/* full file report */
.report{display:flex;flex-direction:column;gap:20px}
.rep-hero{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:22px 24px;border-radius:18px;background:color-mix(in oklab,var(--pc) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--pc) 26%,var(--line))}
.rep-hero h1{font-size:clamp(22px,3vw,32px)}
.rep-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.rep-layout{grid-template-columns:minmax(0,1fr)}.rep-toc{position:static!important;flex-direction:row!important;flex-wrap:wrap;max-height:none!important}.rep-toc .toc-sub,.rep-toc .lv1,.rep-toc .lv2{display:none}}
.rep-toc{position:sticky;top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow:auto;padding-inline-end:6px}
.rep-toc button{border:0;background:none;text-align:start;padding:5px 10px;border-radius:8px;font-size:13px;color:var(--ink-2);line-height:1.7}
.rep-toc button:hover{background:var(--surface-2);color:var(--ink)}
.rep-toc .toc-sub{font-size:11.5px;color:var(--ink-3);font-weight:700;margin:12px 10px 2px}
.rep-toc .lv1{font-size:12.5px}
.rep-toc .lv2{font-size:12px;padding-inline-start:22px;color:var(--ink-3)}
.rep-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.rsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:130px;min-width:0}
.rsec>h2{font-size:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rlist.cols{columns:2 280px;column-gap:28px}
.rlist.cols li{break-inside:avoid;margin-bottom:6px}
.rs-item{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px dashed var(--line)}
.rs-item:last-child{border-bottom:0;padding-bottom:0}
.rs-item:first-child{padding-top:0}
.rs-item h3{display:flex;gap:10px;align-items:baseline;font-size:15.5px}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const iso=s=>String(s??'').replace(/[A-Za-z0-9][A-Za-z0-9 .\-_\/&+]*[A-Za-z0-9]|[A-Za-z]/g,m=>/[A-Za-z]/.test(m)?'\u2068'+m+'\u2069':m);
const tx=s=>esc(iso(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=x=>String(x??'').replace(/\d/g,d=>FA[d]);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const fmtNum=v=>typeof v==='number'?v.toLocaleString('fa-IR',{maximumFractionDigits:1}):esc(fa(v));
const jFmt=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tehran'});
function jOf(d){const p=jFmt.formatToParts(d),g=t=>(p.find(x=>x.type===t)||{}).value;return `${g('year')}/${g('month')}/${g('day')}`}
const JDAY=(()=>{const m={};for(let i=-400;i<=400;i++)m[jOf(new Date(Date.now()+i*864e5))]=i;return m})();
const TODAY=jOf(new Date());
const daysTo=j=>j&&j in JDAY?JDAY[j]:null;
const J_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jNice(j){if(!j)return'';const [y,m,d]=j.split('/').map(Number);return fa(`${d} ${J_MONTHS[m-1]||''} ${y}`)}
function whenText(j){const n=daysTo(j);if(n===null)return jNice(j);if(n<0)return fa(`${-n} روز گذشته`);if(n===0)return'امروز';if(n===1)return'فردا';return fa(`${n} روز مانده`)}
const tsNice=iso=>{try{return new Date(iso).toLocaleString('fa-IR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tehran'})}catch(e){return''}};
const tsDate=iso=>{try{return new Date(iso).toLocaleDateString('fa-IR',{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Tehran'})}catch(e){return''}};
const fileUrl=p=>String(p).split('/').map(encodeURIComponent).join('/');

/* ---------- vocab ---------- */
const GROUPS=[{k:'done',l:'انجام‌شده',mix:100},{k:'active',l:'در حال انجام',mix:70},{k:'review',l:'تحلیل و بررسی',mix:48},{k:'waiting',l:'آماده / در انتظار',mix:30},{k:'backlog',l:'بک‌لاگ',mix:16},{k:'unknown',l:'بدون وضعیت',mix:null},{k:'blocked',l:'متوقف / با تأخیر',mix:null}];
const GL=Object.fromEntries(GROUPS.map(g=>[g.k,g.l]));
const OPEN_ORDER=['blocked','active','review','waiting','backlog','unknown','done'];
const PRIOS=[['Critical','بحرانی'],['High','بالا'],['Medium','متوسط'],['Low','پایین'],['','ثبت‌نشده']];
const PL=Object.fromEntries(PRIOS);
const PRANK={Critical:0,High:1,Medium:2,Low:3,'':4};
function shade(k,base='var(--pc)'){const g=GROUPS.find(x=>x.k===k);if(!g||g.mix==null)return null;return `color-mix(in oklab,${base} ${g.mix}%,var(--surface))`}
function segHTML(k,w,tip){const s=shade(k);return `<i class="${s?'':'seg-'+k}" style="width:${w}%;${s?'background:'+s:''}" data-tip="${esc(tip)}"></i>`}
const ICON={'on-track':'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3 3 7-7"/></svg>',
  'at-risk':'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l7 13H1z"/><rect x="7.2" y="6" width="1.6" height="4.5" fill="var(--surface)"/><rect x="7.2" y="11.4" width="1.6" height="1.6" fill="var(--surface)"/></svg>',
  'off-track':'<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="var(--surface)" stroke-width="1.8"/></svg>'};
const HL={'on-track':'در مسیر','at-risk':'نیازمند توجه','off-track':'بحرانی'};

/* ---------- state ---------- */
const S={D:null,tab:'overview',unit:'all',f:{group:'open',prio:'all',q:''},showAll:false,open:new Set(),openReport:null,repFilter:'all'};
try{const u=localStorage.getItem('kp.unit');if(u)S.unit=u}catch(e){}
const PROD=id=>(S.D.products.find(p=>p.id===id));
function productList(){return S.D.products.filter(p=>(p.unit||'product')===S.unit)}
const taskProducts=()=>productList().filter(p=>p.kind!=='metrics');
const unitWord=()=>{const l=(curUnit().itemsLabel||'محصولات');return {many:l,one:l.replace(/\u200c?ها$/,'').replace(/ات$/,'')}};
function itemsOf(pid){return (S.D.tasks[pid])||[]}
function stats(items){const c={done:0,active:0,review:0,waiting:0,backlog:0,unknown:0,blocked:0,total:items.length,overdue:0,soon:0,crit:0};
  for(const t of items){const g=GL[t.group]?t.group:'unknown';c[g]++;if(g!=='done'){const n=daysTo(t.deadline);if(n!==null&&n<0)c.overdue++;if(n!==null&&n>=0&&n<=14)c.soon++;if(t.priority==='Critical')c.crit++}}
  // progress: a done task counts 100, others their explicit sheet percentage (Progress / درصد پیشرفت), else 0 — same rule as sync.mjs
  c.open=c.total-c.done;c.donePct=pct(c.done,c.total);c.pct=c.total?Math.round(items.reduce((s,t)=>s+taskPct(t),0)/c.total):0;return c}
const taskPct=t=>t.group==='done'?100:typeof t.progress==='number'?t.progress:0;
const histPct=c=>c&&c.total?(typeof c.pts==='number'?Math.round(c.pts/c.total):pct(c.done,c.total)):null;
function healthOf(p,c){if(p.health&&p.health!=='auto')return p.health;if(c.blocked>=2&&c.overdue>=4)return'off-track';if(c.blocked>0||c.overdue>=3||c.crit>=2)return'at-risk';return'on-track'}
const stalePill=p=>p&&p.stale?`<span class="health off-track" data-tip="${esc('برگه‌ی این محصول در گوگل‌شیت پیدا نشد؛ آخرین داده‌ی موجود نمایش داده می‌شود.')}">${ICON['at-risk']}داده‌ی ${esc(tsDate(p.stale))}</span>`:'';
const healthPill=h=>`<span class="health ${h}">${ICON[h]}${HL[h]}</span>`;
function sortTasks(a,b){return (b.flag?1:0)-(a.flag?1:0)||OPEN_ORDER.indexOf(a.group)-OPEN_ORDER.indexOf(b.group)||(PRANK[a.priority||'']-PRANK[b.priority||''])||String(a.deadline||'9').localeCompare(String(b.deadline||'9'))}
function nextDue(items){return items.filter(t=>t.group!=='done'&&t.deadline&&daysTo(t.deadline)!==null).sort((a,b)=>a.deadline.localeCompare(b.deadline))}
const pstyle=p=>`--p:${esc((p&&p.color)||'#2a78d6')}`;

/* ---------- charts ---------- */
function ring(v,size=64){const r=size/2-5,c=2*Math.PI*r,d=c*v/100;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${fa(v)}٪ پیشرفت"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--pc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.4}" font-weight="800" style="fill:var(--ink)">${fa(v)}٪</text></svg>`}
function stackBar(c,cls=''){if(!c.total)return `<div class="sbar ${cls}"></div>`;
  return `<div class="sbar ${cls}">${GROUPS.filter(g=>c[g.k]).map(g=>segHTML(g.k,c[g.k]/c.total*100,`${g.l}: ${fa(c[g.k])} مورد (${fa(pct(c[g.k],c.total))}٪)`)).join('')}</div>`}
function legendShades(){return `<div class="legend">${GROUPS.map(g=>{const s=shade(g.k,'var(--ink-2)');return `<span><i class="${s?'':'seg-'+g.k}" style="${s?'background:'+s:''}"></i>${g.l}</span>`}).join('')}</div>`}
function arc(cx,cy,r0,r1,a0,a1){a1=Math.min(a1,a0+2*Math.PI-1e-4);const P=(r,a)=>[cx+r*Math.sin(a),cy-r*Math.cos(a)],L=a1-a0>Math.PI?1:0;
  const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r1} ${r1} 0 ${L} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r0} ${r0} 0 ${L} 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`}
let pid_=0;
function donut(slices,{size=170,center='',sub=''}={}){const tot=slices.reduce((s,x)=>s+x.v,0),id='pt'+(++pid_);if(!tot)return'';
  let a=0;const gap=slices.filter(s=>s.v).length>1?0.025:0;
  const paths=slices.filter(s=>s.v).map(s=>{const a0=a,a1=a+s.v/tot*2*Math.PI;a=a1;const fill=s.k==='unknown'?`url(#${id}u)`:s.k==='blocked'?`url(#${id}b)`:s.fill;
    return `<path d="${arc(size/2,size/2,size/2-24,size/2-2,a0+gap/2,a1-gap/2)}" style="fill:${fill}" data-tip="${esc(s.tip)}"/>`}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(center+' '+sub)}"><defs>
  <pattern id="${id}u" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--surface-2)"/><rect width="3" height="6" style="fill:var(--line)"/></pattern>
  <pattern id="${id}b" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:color-mix(in oklab,var(--crit) 65%,var(--surface))"/><rect width="4" height="7" style="fill:var(--crit)"/></pattern></defs>
  ${paths}<text x="50%" y="46%" text-anchor="middle" font-size="26" font-weight="800" style="fill:var(--ink)">${esc(center)}</text><text x="50%" y="62%" text-anchor="middle" font-size="12">${esc(sub)}</text></svg>`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function lineChart(series,labels,{h=250,max=null,unit=''}={}){
  const W=680,padL=40,padR=110,padT=14,padB=30,iw=W-padL-padR,ih=h-padT-padB,n=labels.length;
  const mx=max??niceMax(Math.max(1,...series.flatMap(s=>s.values.filter(v=>typeof v==='number'))));
  const x=i=>padL+(n<=1?iw/2:i*iw/(n-1)),y=v=>padT+ih-(v/mx)*ih;
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end" font-size="11">${fa(Math.round(v))}${unit}</text>`}
  const step=Math.max(1,Math.ceil(n/6));labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="11">${esc(l)}</text>`});
  const ends=[];
  const lines=series.map(s=>{const pts=s.values.map((v,i)=>typeof v==='number'?[x(i),y(v)]:null).filter(Boolean);if(!pts.length)return'';
    const last=pts[pts.length-1];ends.push({y:last[1],x:last[0],name:s.name,v:s.values[s.values.length-1]});
    return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`}).join('');
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;
  const endL=ends.map(e=>`<text x="${e.x+10}" y="${e.y+4}" font-size="11.5" style="fill:var(--ink)">${esc(e.name)} ${typeof e.v==='number'?fa(Math.round(e.v))+unit:''}</text>`).join('');
  const hits=labels.map((l,i)=>{const w=n<=1?iw:iw/(n-1);const tip=l+'\n'+series.map(s=>`${s.name}: ${typeof s.values[i]==='number'?fmtNum(s.values[i])+unit:'—'}`).join('\n');
    return `<rect x="${x(i)-w/2}" y="${padT}" width="${w}" height="${ih}" fill="transparent" data-tip="${esc(tip)}" data-cross="${x(i)}"/>`}).join('');
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;direction:ltr" role="img">${g}${lines}${endL}<line class="cross" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" style="stroke:var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/>${hits}</svg>`}

/* ---------- overview ---------- */
function execSentence(ps){
  const c=stats(ps.flatMap(p=>itemsOf(p.id)));if(!c.total)return'';
  const rows=ps.map(p=>({p,c:stats(itemsOf(p.id))}));
  const risky=rows.filter(x=>healthOf(x.p,x.c)!=='on-track').map(x=>x.p.name);
  const best=rows.filter(x=>x.c.total>=5).sort((a,b)=>b.c.pct-a.c.pct)[0];
  let s=`در ${fa(ps.length)} ${unitWord().one}، ${fa(c.total)} کار ثبت شده و پیشرفت کلی ${fa(c.pct)}٪ است. ${fa(c.done)} مورد انجام شده، ${fa(c.active)} مورد در حال انجام و ${fa(c.review)} مورد در مرحله‌ی تحلیل و بررسی است.`;
  if(best)s+=` بیشترین پیشرفت مربوط به ${best.p.name} با ${fa(best.c.pct)}٪ است.`;
  if(c.overdue)s+=` ${fa(c.overdue)} کار باز از مهلت خود گذشته است.`;
  if(risky.length)s+=` ${risky.join('، ')} نیازمند توجه ${risky.length>1?'هستند':'است'}.`;
  return s}
function renderOverview(){

  h+=`<section><div class="sec-head"><div><h2>${esc(W.many)}</h2><p>درصد پیشرفت، وضعیت سلامت و نزدیک‌ترین مهلت هر ${esc(W.one)}. برای جزئیات روی کارت بزنید.</p></div></div><div class="grid-3">`+ps.map(p=>{

    ${ps.map(p=>{const s=stats(itemsOf(p.id));return `<div class="port-row pc" style="${pstyle(p)}"><button class="pn" data-act="tab" data-id="p-${esc(p.id)}"><span class="sw"></span>${esc(p.name)}</button>${stackBar(s,'lg')}<span class="pt">${fa(s.total)} کار</span></div>`}).join('')}

  h+=`<section class="grid-main"><div class="panel"><div class="sec-head" style="margin-bottom:8px"><div><h2>روند پیشرفت</h2><p>درصد پیشرفت هر ${esc(unitWord().one)} در هر به‌روزرسانی.</p></div></div>${trendChart(ps)}</div>
    <div class="panel"><div class="sec-head" style="margin-bottom:4px"><div><h2>مهلت‌های پیش رو</h2><p>کارهای باز گذشته از مهلت و ۱۴ روز آینده.</p></div></div>${deadlineList(ps.flatMap(p=>itemsOf(p.id).map(t=>({...t,_p:p}))),10)}</div></section>`;

  return h}
function heatTable(ps){
  const rows=ps.map(p=>{const open=itemsOf(p.id).filter(t=>t.group!=='done');return {p,v:PRIOS.map(([k])=>open.filter(t=>(t.priority||'')===k).length)}});
  const mx=Math.max(1,...rows.flatMap(r=>r.v));
  return `<div class="tbl-wrap"><table class="heat"><thead><tr><th>${esc(unitWord().one)}</th>${PRIOS.map(([,l])=>`<th style="text-align:center">${l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td class="pc" style="${pstyle(r.p)};white-space:nowrap"><span style="display:inline-flex;gap:7px;align-items:center;font-weight:600"><span class="sw"></span>${esc(r.p.name)}</span></td>${r.v.map((v,i)=>{const k=v?Math.round(12+v/mx*78):0;
    return `<td class="h" style="background:${v?`color-mix(in oklab,var(--ink) ${k}%,var(--surface))`:'var(--surface-2)'};color:${k>48?'var(--surface)':'var(--ink)'}" data-tip="${esc(r.p.name+' · '+PRIOS[i][1]+': '+fa(v)+' کار باز')}">${v?fa(v):'<span class="faint">·</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function trendChart(ps){
  const hist=(S.D.history||[]).filter(h=>h.counts);
  if(hist.filter(h=>ps.some(p=>h.counts[p.id]&&h.counts[p.id].total)).length<2)return emptyInner('روند پس از دومین به‌روزرسانی نمایش داده می‌شود',`تاکنون ${fa(hist.length)} نقطه ثبت شده است. هر به‌روزرسانی یک نقطه به این نمودار اضافه می‌کند.`);
  const H=hist.filter(h=>ps.some(p=>h.counts[p.id]&&h.counts[p.id].total)).slice(-20),labels=H.map(h=>fa(String(h.label||jOf(new Date(h.at))).slice(5)));

function deadlineList(items,limit=10){

  if(!r.ok){const e=new Error('github');e.status=r.status;try{e.data=await r.json()}catch(x){}throw e}
  return r.status===204?null:r.json()}
// Checks the key in stages so the admin learns exactly what to fix.
async function verify(){
  let me;
  try{me=await gh('/user')}catch(e){throw {stage:e.status===401?'bad':'net',status:e.status}}
  A.login=me.login||'';
  let r;
  try{r=await gh('/repos/'+REPO())}catch(e){throw {stage:(e.status===404||e.status===403)?'repo':'net',status:e.status}}
  if(!r.permissions||!r.permissions.push)throw {stage:'readonly'};
  A.ok=true}
const ORG=()=>REPO().split('/')[0], RNAME=()=>REPO().split('/')[1];
function loginHelp(err){
  const approve=`<a href="https://github.com/organizations/${ORG()}/settings/personal-access-token-requests" target="_blank" rel="noopener">صفحه‌ی درخواست‌های کلید سازمان</a>`;
  if(err.stage==='bad')return `<b>کلید پذیرفته نشد.</b> کلید را دوباره و کامل کپی کنید (با <bdi dir="ltr">github_pat_</bdi> یا <bdi dir="ltr">ghp_</bdi> شروع می‌شود). اگر تاریخ انقضای کلید گذشته، یک کلید تازه بسازید.`;
  if(err.stage==='net')return `<b>ارتباط با GitHub برقرار نشد.</b> اتصال اینترنت را بررسی کنید و دوباره امتحان کنید${err.status?` (کد ${fa(err.status)})`:''}.`;
  if(err.stage==='readonly')return `<b>کلید فقط اجازه‌ی خواندن دارد.</b> در تنظیمات کلید، مجوز <bdi dir="ltr">Contents</bdi> را روی <bdi dir="ltr">Read and write</bdi> بگذارید.`;
  return `<b>کلید درست است${A.login?` (حساب <bdi dir="ltr">${esc(A.login)}</bdi>)`:''}، ولی به مخزن <bdi dir="ltr">${esc(RNAME())}</bdi> دسترسی ندارد.</b> یکی از این سه مورد را بررسی کنید:
    <ol style="margin:6px 0 0;padding-inline-start:20px"><li>هنگام ساخت کلید، <b>Resource owner</b> روی <bdi>${esc(ORG())}</bdi> باشد، نه حساب شخصی.</li>
    <li>در <b>Repository access</b> مخزن <bdi dir="ltr">${esc(RNAME())}</bdi> انتخاب شده باشد (نه <bdi dir="ltr">product</bdi>).</li>
    <li>اگر سازمان برای کلیدها تأیید می‌خواهد، کلید در انتظار تأیید است: ${approve} را باز کنید و آن را <b>Approve</b> کنید.</li></ol>`}
const ghErr=e=>e&&e.status===401?'کلید دسترسی نامعتبر یا منقضی است.':e&&(e.status===403||e.status===404)?'این کلید اجازه‌ی نوشتن در مخزن را ندارد.':e&&e.status===422?'فایلی با همین نام وجود دارد.':e&&e.status===409?'تداخل با تغییر دیگری پیش آمد؛ دوباره تلاش کنید.':'ارتباط با GitHub برقرار نشد؛ اتصال اینترنت را بررسی کنید.';
const safeName=s=>String(s).replace(/[\\/:*?"<>|#%\u0000-\u001f]+/g,' ').replace(/^\.+/,'').replace(/\s+/g,' ').trim().slice(0,90);
const OK_EXT=['pptx','docx','xlsx','xls','csv','pdf','png','jpg','jpeg','webp','gif'];
function fileB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)})}

function renderAdmin(){
  if(!A.ok)return `<section style="max-width:640px"><div class="panel form" id="admRoot"><h1>ورود ادمین</h1>
    <p class="muted" style="font-size:13px">این بخش فقط برای ادمین است. کلید دسترسی GitHub را یک بار وارد کنید؛ فقط در همین مرورگر ذخیره می‌شود و روی سایت یا مخزن قرار نمی‌گیرد.</p>
    <form class="form" id="loginForm"><label class="f"><span>کلید دسترسی (Personal access token)</span><input id="tokIn" type="password" autocomplete="off" dir="ltr" placeholder="github_pat_…" required></label>
    <div class="row"><button class="btn primary" type="submit">ورود</button><span class="note" id="loginSt"></span></div><div class="pending" id="loginErr" hidden style="line-height:2"></div></form>
    <div class="codebox"><b>ساخت کلید (فقط یک بار):</b><ol style="margin:4px 0 0;padding-inline-start:20px">
    <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">این صفحه‌ی GitHub</a> را باز کنید.</li>
    <li><b>Token name</b>: یک نام دلخواه، مثلاً <bdi dir="ltr">dashboard</bdi>. <b>Expiration</b>: یک سال یا بیشتر.</li>
    <li><b>Resource owner</b>: <bdi>${esc(ORG())}</bdi> (نه حساب شخصی).</li>
    <li><b>Repository access</b>: گزینه‌ی <bdi dir="ltr">Only select repositories</bdi> و مخزن <bdi dir="ltr">${esc(RNAME())}</bdi>.</li>
    <li><b>Permissions</b> ← <bdi dir="ltr">Repository permissions</bdi>: <bdi dir="ltr">Contents</bdi> و <bdi dir="ltr">Actions</bdi> هر دو روی <bdi dir="ltr">Read and write</bdi>.</li>
    <li><b>Generate token</b> را بزنید، کلید را کپی کنید و همین‌جا وارد کنید.</li>
    <li>اگر پیام «در انتظار تأیید» دیدید، در <a href="https://github.com/organizations/${esc(ORG())}/settings/personal-access-token-requests" target="_blank" rel="noopener">درخواست‌های کلید سازمان</a> آن را <b>Approve</b> کنید.</li></ol></div></div></section>`;
  const ps=productList(),reps=S.D.reports;
  return `<section class="sec-head"><div><h1>مدیریت و بارگذاری</h1><p>ورود با حساب <b dir="ltr">${esc(A.login||'GitHub')}</b>. هر چه اینجا بارگذاری یا حذف کنید، چند دقیقه بعد برای همه‌ی بینندگان اعمال می‌شود.</p></div>
    <div class="row"><button class="btn" data-act="dispatch">به‌روزرسانی فوری از شیت</button><button class="btn" data-act="logout">خروج</button></div></section>
  <section class="grid-2" id="admRoot"><div class="panel form"><h2>بارگذاری فایل و ساخت گزارش</h2>
    <form class="form" id="upForm">
    <div class="grid-2"><label class="f"><span>محصول</span><select id="upP">${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name.replace(/[⁨⁩]/g,''))}</option>`).join('')}</select></label>
    <label class="f"><span>عنوان گزارش (اختیاری)</span><input id="upT" placeholder="اگر خالی باشد، نام فایل"></label></div>
    <label class="drop" id="upDrop" for="upF"><b>فایل را اینجا رها کنید یا برای انتخاب بزنید</b><span>PowerPoint (pptx) · Word (docx) · Excel (xlsx, csv) · PDF · تصویر — حداکثر ۲۵ مگابایت</span><span id="upFn" class="faint"></span></label>
    <input id="upF" type="file" hidden accept=".pptx,.docx,.xlsx,.xls,.csv,.pdf,.png,.jpg,.jpeg,.webp,.gif">
    <label class="f"><span>توضیح برای تحلیل (اختیاری)</span><textarea id="upN" placeholder="مثلاً: گزارش فروش شهریور است؛ مقایسه با ماه قبل مهم است."></textarea></label>
    <div class="steps" id="upSteps" hidden></div>
    <div class="row"><button class="btn primary" type="submit" id="upGo">بارگذاری و ساخت گزارش</button></div></form>
    <p class="note">جدول‌ها، نمودار اکسل، متن ورد، PDF و تصویر حدود ۲ دقیقه بعد روی داشبورد می‌آیند. گزارش کامل (خلاصه، تحلیل بخش‌به‌بخش، نقشه‌ی راه، ریسک‌ها و تصمیم‌ها) حدود ۵ دقیقه بعد آماده می‌شود.</p></div>
    <div class="panel form"><h2>گزارش‌های موجود</h2>${reps.length?`<div class="adm-list">${reps.map(r=>{const p=PROD(r.product)||{};return `<div class="adm-row pc" style="${pstyle(p)}"><span class="sw" data-tip="${esc(p.name||'')}"></span><span class="t"><button class="pn" style="border:0;background:none;padding:0;font-weight:600;text-align:start" data-act="openRep" data-id="${esc(r.id)}">${esc(r.title)}</button><span class="faint" style="font-size:11.5px"> · ${esc(tsDate(r.createdAt))}${r.aiPending?' · در انتظار تحلیل':''}</span></span><button class="btn sm danger" data-act="delRep" data-id="${esc(r.id)}">حذف</button></div>`}).join('')}</div>`:emptyInner('هنوز گزارشی نیست','اولین فایل را از فرم کناری بارگذاری کنید.')}</div></section>`}
function mountAdmin(){
  const lf=$('#loginForm');
  if(lf)lf.onsubmit=async e=>{e.preventDefault();const st=$('#loginSt'),box=$('#loginErr');A.token=$('#tokIn').value.replace(/\s+/g,'');st.textContent='در حال بررسی…';box.hidden=true;
    try{await verify();try{localStorage.setItem('kp.token',A.token)}catch(x){}toast('ورود انجام شد');render()}catch(err){A.ok=false;st.textContent='';box.innerHTML=loginHelp(err&&err.stage?err:{stage:'net'});box.hidden=false}};
  const uf=$('#upForm');if(!uf)return;
  let file=null;const setF=f=>{file=f||null;$('#upFn').textContent=f?`${f.name} · ${fa((f.size/1048576).toFixed(1))} مگابایت`:''};
  $('#upF').onchange=e=>setF(e.target.files[0]);const dz=$('#upDrop');
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');setF(e.dataTransfer.files[0])};
  uf.onsubmit=async e=>{e.preventDefault();if(!file)return toast('ابتدا یک فایل انتخاب کنید');
    const ext=file.name.split('.').pop().toLowerCase();if(!OK_EXT.includes(ext))return toast(ext==='doc'?'فایل doc قدیمی است؛ آن را به docx تبدیل کنید.':'این نوع فایل پشتیبانی نمی‌شود.');
    if(file.size>25*1048576)return toast('حجم فایل بیش از ۲۵ مگابایت است');
    const pid=$('#upP').value,base=safeName($('#upT').value)||safeName(file.name.replace(/\.[^.]+$/,''))||'گزارش';
    let name=`${base}.${ext}`;const taken=new Set(S.D.reports.map(r=>r.file));for(let i=2;taken.has(`uploads/${pid}/${name}`);i++)name=`${base} (${i}).${ext}`;
    const rel=`uploads/${pid}/${name}`,api='/repos/'+REPO()+'/contents/'+rel.split('/').map(encodeURIComponent).join('/');
    const L=['خواندن فایل','ارسال به مخزن','ساخت گزارش روی داشبورد (حدود ۲ دقیقه)'];let cur=0;const steps=$('#upSteps');steps.hidden=false;
    const paint=err=>{steps.innerHTML=L.map((l,i)=>`<div class="${i<cur?'ok':i===cur?(err?'err':'on'):''}">${i<cur?'✓':i===cur?(err?'✕':'◌'):'·'} ${l}${i===cur&&err?' — '+esc(err):''}</div>`).join('')};
    const done=()=>{A.busy=false;$('#upGo').disabled=false};
    A.busy=true;$('#upGo').disabled=true;paint();
    try{const content=await fileB64(file);cur=1;paint();
      const note=$('#upN').value.trim(),title=safeName($('#upT').value);
      if(note||title)await gh(api+'.note.json',{method:'PUT',body:JSON.stringify({message:'توضیح فایل: '+name,branch:'main',content:b64enc(JSON.stringify({title,note},null,1))})});
      await gh(api,{method:'PUT',body:JSON.stringify({message:'بارگذاری فایل: '+name,branch:'main',content})});
      cur=2;paint();
      const t0=Date.now();
      const poll=async()=>{await load();const r=S.D.reports.find(x=>x.file===rel);
        if(r){cur=3;paint();done();toast('گزارش روی داشبورد قرار گرفت');S.repFilter='all';go('rep-'+r.id);return}
        if(Date.now()-t0>6*60e3){paint('بیش از حد معمول طول کشید؛ چند دقیقه بعد بخش گزارش‌ها را ببینید.');done();return}
        setTimeout(poll,20000)};
      setTimeout(poll,45000)}
    catch(err){paint(ghErr(err));done()}}}
// delete button for the reports tab and the report page; shown only to a signed-in admin (deleting needs the GitHub key)
const delBtn=(r,label)=>A.ok?`<button class="btn sm danger" data-act="delRep" data-id="${esc(r.id)}" data-label="${esc(label)}">${esc(label)}</button>`:'';
// reports deleted in this browser stay hidden until the site republishes without them
const GONE=new Set();
async function deleteReport(id,btn){const r=S.D.reports.find(x=>x.id===id);if(!r)return;
  const label=btn.dataset.label||'حذف';
  if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='تأیید حذف';setTimeout(()=>{if(!btn.disabled){btn.classList.remove('armed');btn.textContent=label}},5000);return}
  btn.disabled=true;btn.textContent='در حال حذف…';
  try{for(const path of [r.file,r.file+'.note.json',`data/ai/reports/${r.id}.json`]){const api='/repos/'+REPO()+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
      let sha=null;try{sha=(await gh(api+'?ref=main')).sha}catch(e){if(e.status!==404)throw e}
      if(sha)await gh(api,{method:'DELETE',body:JSON.stringify({message:'حذف گزارش: '+r.fileName,sha,branch:'main'})})}
    GONE.add(id);S.D.reports=S.D.reports.filter(x=>x.id!==id);
    toast('گزارش حذف شد');if(S.openReport===id)go('reports');else render()}
  catch(err){btn.disabled=false;btn.classList.remove('armed');btn.textContent=label;toast(ghErr(err))}}
async function dispatchSync(btn){btn.disabled=true;
  try{await gh('/repos/'+REPO()+'/actions/workflows/publish.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main'})});toast('به‌روزرسانی شروع شد؛ حدود ۲ دقیقه طول می‌کشد');setTimeout(load,120000)}
  catch(err){toast(ghErr(err))}finally{setTimeout(()=>btn.disabled=false,5000)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const {act,id}=b.dataset;
  if(act==='logout'){A.ok=false;A.token=null;try{localStorage.removeItem('kp.token')}catch(x){}go('overview');toast('از حساب ادمین خارج شدید')}
  else if(act==='delRep')deleteReport(id,b);
  else if(act==='dispatch')dispatchSync(b)});
new MutationObserver(()=>{if(S.tab==='admin'&&!A.busy)mountAdmin()}).observe($('#main'),{childList:true});

/* ---------- data ---------- */
async function load(){
  try{const r=await fetch('data/dashboard.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();d.reports=(d.reports||[]).filter(x=>!GONE.has(x.id));
    // isolate Latin product names (e.g. "118 Pro") so they are not reordered inside Persian text
    d.products.forEach(p=>{p.name='⁨'+p.name+'⁩'});
    const first=!S.D,changed=first||S.D.generatedAt!==d.generatedAt;S.D=d;if(changed)render();
    if(first&&A.token&&!A.ok)verify().then(render).catch(()=>{})}
  catch(e){if(!S.D)$('#main').innerHTML=emptyState('دریافت داده‌ها ممکن نشد','اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.')}}
const h0=decodeURIComponent(location.hash.slice(1));if(h0){if(h0.startsWith('rep-')){S.tab='reports';S.openReport=h0.slice(4)}else S.tab=h0}
load();
setInterval(()=>{if(document.visibilityState==='visible')load()},10*60*1000);
setInterval(()=>{if(document.visibilityState!=='visible'||!S.D||!S.openReport)return;const r=S.D.reports.find(x=>x.id===S.openReport);if(r&&r.aiPending)load()},60*1000);
</script>
